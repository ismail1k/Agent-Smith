[project]
name = "agent-smith"
version = "1.0.0"
description = "Autonomous reasoning, code generation, and execution"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.1.6",
    "fire>=0.7.1",
    "mcp[cli]>=2.3.0",
]

[project.scripts]
sandbox = "src.console.sandbox:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]